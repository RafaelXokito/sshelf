name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: |
          go vet ./...
          go vet -tags devcheck ./...
      - name: golangci-lint (NFR-QUAL-002)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --build-tags=devcheck
      - name: govulncheck (SEC-SESSION-004)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test -race (NFR-PORT-001, NFR-REL-001)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage report (NFR-QUAL-003, not gated yet)
        run: go tool cover -func=coverage.out | tee -a "$GITHUB_STEP_SUMMARY"

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build 4 static targets (NFR-BUILD-001)
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            bin="dist/sshelf-$os-$arch"
            GOOS=$os GOARCH=$arch go build -trimpath -o "$bin" ./cmd/sshelf
            go version -m "$bin" | grep -q 'CGO_ENABLED=0' || { echo "$bin: not CGO_ENABLED=0"; exit 1; }
            file "$bin"
            if [ "$os" = linux ]; then
              file "$bin" | grep -q 'statically linked' || { echo "$bin: not statically linked"; exit 1; }
            fi
          done
