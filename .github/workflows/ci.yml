name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: |
          go vet ./...
          go vet -tags devcheck ./...
          go vet -tags integration_keyring ./...
      - name: Traceability gate (NFR-QUAL-001)
        run: go run ./scripts/tracecheck
      - name: golangci-lint (NFR-QUAL-002)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --build-tags=devcheck,integration_keyring
      - name: govulncheck (SEC-SESSION-004)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -race (NFR-PORT-001, NFR-REL-001)
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: performance limits without -race (NFR-PERF-002)
        run: go test -count=1 -run 'TestNFR_PERF_' ./...
      - name: Coverage gate (NFR-QUAL-003)
        shell: bash # -o pipefail, so a failing gate is not hidden by tee
        run: go run ./scripts/covercheck coverage.out | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fuzz config.json loading for 30 s (T-006)
        if: matrix.os == 'ubuntu-latest'
        run: go test -run '^$' -fuzz '^FuzzLoadConfig$' -fuzztime 30s ./internal/store
      - name: Fuzz Sanitize for 30 s (T-013, SEC-SESSION-003)
        if: matrix.os == 'ubuntu-latest'
        run: go test -run '^$' -fuzz '^FuzzSEC_SESSION_003_Sanitize$' -fuzztime 30s ./internal/domain

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build 4 static targets (NFR-BUILD-001), stamped with version, commit and date (FR-CLI-001)
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          version=$(git describe --tags --always --dirty)
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ldflags="-X main.version=$version -X main.commit=$GITHUB_SHA -X main.date=$date"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            bin="dist/sshelf-$os-$arch"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "$bin" ./cmd/sshelf
            go version -m "$bin" | grep -q 'CGO_ENABLED=0' || { echo "$bin: not CGO_ENABLED=0"; exit 1; }
            file "$bin"
            if [ "$os" = linux ]; then
              file "$bin" | grep -q 'statically linked' || { echo "$bin: not statically linked"; exit 1; }
            fi
          done
          want="sshelf $version (commit $GITHUB_SHA, built $date)"
          got=$(dist/sshelf-linux-amd64 --version)
          [ "$got" = "$want" ] || { echo "--version: got '$got', want '$want'"; exit 1; }
      - name: Release binaries at most 20 MB per target (NFR-SIZE-002)
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          limit=20971520
          version=$(git describe --tags --always --dirty)
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ldflags="-s -w -X main.version=$version -X main.commit=$GITHUB_SHA -X main.date=$date"
          fail=0
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            bin="dist/release/sshelf-$os-$arch"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "$bin" ./cmd/sshelf
            size=$(stat -c %s "$bin")
            echo "$target: $size bytes (limit $limit)" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$size" -gt "$limit" ]; then echo "$bin exceeds $limit bytes"; fail=1; fi
          done
          exit $fail

  # Real OS credential-store tests (T-010, credential-storage §8). They run
  # only here, never on a developer machine, and never touch a login
  # keychain: each job uses a throwaway store and a random
  # sshelf-test-<hex> service.
  keyring-macos:
    runs-on: macos-latest
    env:
      SSHELF_KEYRING_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Throwaway keychain as the only keychain in the search list
        run: |
          set -eu
          security create-keychain -p x sshelf-ci.keychain
          security set-keychain-settings sshelf-ci.keychain
          security unlock-keychain -p x sshelf-ci.keychain
          security list-keychains -d user -s sshelf-ci.keychain
          security default-keychain -d user -s sshelf-ci.keychain
          security list-keychains -d user
          security default-keychain -d user
      - name: go test -tags integration_keyring (SEC-CRED-003, FR-CRED-001)
        run: go test -race -count=1 -v -tags integration_keyring ./internal/secrets
      - name: Delete the throwaway keychain
        if: always()
        run: security delete-keychain sshelf-ci.keychain || true

  keyring-linux:
    runs-on: ubuntu-latest
    env:
      SSHELF_KEYRING_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install gnome-keyring and dbus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus
      - name: go test -tags integration_keyring under dbus-run-session (SEC-CRED-003, FR-CRED-001)
        run: |
          dbus-run-session -- sh -c '
            set -eu
            echo x | gnome-keyring-daemon --unlock --components=secrets
            go test -race -count=1 -v -tags integration_keyring ./internal/secrets
          '

  # Headless Linux: a container has no session bus, no dbus-launch and no
  # Secret Service, so every call must be ErrUnavailable (SEC-CRED-005).
  keyring-linux-nobus:
    runs-on: ubuntu-latest
    container: golang:1.26
    env:
      SSHELF_KEYRING_TESTS: "1"
      SSHELF_KEYRING_NO_BUS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Check there is no session bus
        run: |
          if [ -n "${DBUS_SESSION_BUS_ADDRESS:-}" ]; then echo "session bus present"; exit 1; fi
          if command -v dbus-launch; then echo "dbus-launch present"; exit 1; fi
      - name: go test -tags integration_keyring without a session bus (SEC-CRED-005)
        run: go test -count=1 -v -tags integration_keyring -run 'TestSEC_CRED_005_' ./internal/secrets
